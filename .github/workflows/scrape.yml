name: Eme Studios Scraper

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Product limit per category (0=full)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0 18 * * 0'  # Sunday 6PM
    - cron: '0 18 * * 4'  # Thursday 6PM

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ inputs.limit }}" != "0" ]; then
            python3 run.py --limit ${{ inputs.limit }}
          else
            python3 run.py
        timeout-minutes: 60

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: scraper.log
          retention-days: 7